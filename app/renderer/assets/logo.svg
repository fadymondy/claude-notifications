<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Claude Notifications">
  <defs>
    <linearGradient id="bell-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff8a3d"/>
      <stop offset="100%" stop-color="#d96027"/>
    </linearGradient>
    <linearGradient id="dot-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff5c63"/>
      <stop offset="100%" stop-color="#c2293f"/>
    </linearGradient>
    <filter id="bell-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#000" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- soft notification ping ring -->
  <circle cx="32" cy="34" r="26" fill="none" stroke="url(#bell-grad)" stroke-opacity="0.18" stroke-width="2"/>

  <g filter="url(#bell-shadow)">
    <!-- Bell stem -->
    <rect x="29" y="9" width="6" height="6" rx="2" fill="url(#bell-grad)"/>

    <!-- Bell body — rounded trapezoid -->
    <path d="M16 41
             L16 29
             C16 22 20 16 26 14.5
             A6 6 0 0 1 38 14.5
             C44 16 48 22 48 29
             L48 41
             L51 45
             A1.5 1.5 0 0 1 49.5 47
             L14.5 47
             A1.5 1.5 0 0 1 13 45
             Z"
          fill="url(#bell-grad)"/>

    <!-- Inner highlight -->
    <path d="M22 28
             C22 22 26 18 32 18
             C32 18 28 21 26 26
             C24.5 30 24 35 24 38
             Z"
          fill="#fff" fill-opacity="0.18"/>

    <!-- Clapper -->
    <ellipse cx="32" cy="52" rx="4" ry="3.5" fill="url(#bell-grad)"/>
  </g>

  <!-- Notification badge (the "new" dot) -->
  <circle cx="48" cy="14" r="8" fill="url(#dot-grad)"/>
  <circle cx="48" cy="14" r="8" fill="none" stroke="#0f1115" stroke-opacity="0.4" stroke-width="1.5"/>
  <circle cx="48" cy="14" r="2.5" fill="#fff" fill-opacity="0.85"/>
</svg>
