<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self';">
<title>Claude Notifications — Settings</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
  <aside class="sidebar">
    <header class="brand">
      <div class="logo">🔔</div>
      <div class="title-block">
        <div class="title">Claude Notifications</div>
        <div class="subtitle" id="version">…</div>
      </div>
    </header>
    <nav id="channel-list" class="channel-list" aria-label="Channels"></nav>
    <footer class="sidebar-footer">
      <button id="open-config" class="btn btn-link" type="button">Open config file</button>
      <button id="view-log" class="btn btn-link" type="button">View log</button>
    </footer>
  </aside>

  <main class="content">
    <header class="content-header">
      <div>
        <h1 id="channel-title">…</h1>
        <p id="channel-summary" class="muted">…</p>
      </div>
      <div class="actions">
        <button id="test-btn" class="btn btn-secondary" type="button">Send test</button>
        <button id="save-btn" class="btn btn-primary" type="button">Save changes</button>
      </div>
    </header>

    <section class="form-section">
      <form id="channel-form" autocomplete="off"></form>
    </section>

    <section class="events-section">
      <h2>Events that trigger this channel</h2>
      <p class="muted">Pick which Claude Code lifecycle events fan out to <span id="events-channel-name">this channel</span>. Don't enable <code>pre-tool</code> or <code>post-tool</code> unless you really want noise — they fire many times per turn.</p>
      <div id="events-grid" class="events-grid"></div>
    </section>

    <section class="status-section">
      <div id="status-msg" class="status-msg" role="status" aria-live="polite"></div>
    </section>
  </main>
</div>

<script src="app.js"></script>
</body>
</html>
