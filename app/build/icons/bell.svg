<!--
  Boxicons bxs-bell — solid bell glyph.
  Source: https://github.com/atisawd/boxicons (MIT)
  Used as the tray menubar icon. Solid (filled) version reads better at small
  sizes than the outlined variant, where 1px strokes can disappear.

  We add a single-path enhancement: a hairline highlight inside the body to
  give the silhouette some depth on dark menubars without breaking the
  monochrome template-image aesthetic. The highlight uses fill="currentColor"
  with reduced opacity, so macOS template mode still inverts the whole icon
  cleanly when the menubar appearance changes.
-->
