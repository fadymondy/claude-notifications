name: release

on:
  push:
    tags:
      - 'v*.*.*'
      - 'app-v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g. v0.3.0). Leave blank to use HEAD.'
        required: false

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: dist:mac
            artifacts: |
              app/dist/*.dmg
              app/dist/*.zip
              app/dist/latest-mac.yml
              app/dist/latest-mac.yaml
              app/dist/latest-mac.json
          - os: windows-latest
            target: dist:win
            artifacts: |
              app/dist/*.exe
              app/dist/*.blockmap
              app/dist/latest.yml
          - os: ubuntu-latest
            target: dist:linux
            artifacts: |
              app/dist/*.AppImage
              app/dist/*.deb
              app/dist/latest-linux.yml
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install deps
        shell: bash
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi

      - name: Smoke tests
        run: npm test

      - name: Prepare signing credentials
        id: signing
        shell: bash
        env:
          MAC_CERTS:        ${{ secrets.MAC_CERTS }}
          MAC_CERTS_PASSWORD: ${{ secrets.MAC_CERTS_PASSWORD }}
          WIN_CERTS:        ${{ secrets.WIN_CERTS }}
          WIN_CERTS_PASSWORD: ${{ secrets.WIN_CERTS_PASSWORD }}
          APPLE_ID:         ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID:    ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # Decode certs and persist any signing-related env vars into the
          # job's $GITHUB_ENV so the next step picks them up. We *only* set
          # the env vars when their secrets exist — empty values are toxic
          # to electron-builder (it tries to stat "" and crashes).
          if [ -n "$MAC_CERTS" ] && [ "${{ matrix.os }}" = "macos-latest" ]; then
            echo "$MAC_CERTS" | base64 --decode > /tmp/cert.p12
            echo "CSC_LINK=/tmp/cert.p12" >> "$GITHUB_ENV"
            echo "CSC_KEY_PASSWORD=$MAC_CERTS_PASSWORD" >> "$GITHUB_ENV"
            echo "macOS signing: enabled"
          else
            echo "macOS signing: disabled (MAC_CERTS not set)"
          fi
          if [ -n "$APPLE_ID" ] && [ -n "$APPLE_APP_SPECIFIC_PASSWORD" ] && [ -n "$APPLE_TEAM_ID" ] && [ "${{ matrix.os }}" = "macos-latest" ]; then
            echo "APPLE_ID=$APPLE_ID" >> "$GITHUB_ENV"
            echo "APPLE_APP_SPECIFIC_PASSWORD=$APPLE_APP_SPECIFIC_PASSWORD" >> "$GITHUB_ENV"
            echo "APPLE_TEAM_ID=$APPLE_TEAM_ID" >> "$GITHUB_ENV"
            echo "macOS notarization: enabled"
          else
            echo "macOS notarization: disabled (Apple ID/team/password missing)"
          fi
          if [ -n "$WIN_CERTS" ] && [ "${{ matrix.os }}" = "windows-latest" ]; then
            echo "WIN_CSC_LINK=$WIN_CERTS" >> "$GITHUB_ENV"
            echo "WIN_CSC_KEY_PASSWORD=$WIN_CERTS_PASSWORD" >> "$GITHUB_ENV"
            echo "Windows signing: enabled"
          else
            echo "Windows signing: disabled"
          fi

      - name: Build distributables
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # When no signing identity is present we have to disable
          # auto-discovery so electron-builder doesn't pick up the runner's
          # default keychain entries and try to sign with them.
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.MAC_CERTS != '' }}
        run: npm run ${{ matrix.target }} -- --publish never

      - name: List build outputs
        shell: bash
        run: ls -la dist || true

      - name: Upload artifacts (workflow run)
        uses: actions/upload-artifact@v4
        with:
          name: claude-notifications-${{ matrix.os }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: warn
          retention-days: 14

  build-mas:
    name: Build Mac App Store (.pkg)
    runs-on: macos-latest
    if: |
      startsWith(github.ref, 'refs/tags/') &&
      vars.ENABLE_MAS_BUILD == 'true'
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install deps
        run: npm ci

      - name: Decode MAS signing artifacts
        env:
          MAS_CERTS: ${{ secrets.MAS_CERTS }}
          MAS_PROVISIONING_PROFILE: ${{ secrets.MAS_PROVISIONING_PROFILE }}
        shell: bash
        run: |
          echo "$MAS_CERTS" | base64 --decode > /tmp/mas.p12
          echo "$MAS_PROVISIONING_PROFILE" | base64 --decode > build/embedded.provisionprofile

      - name: Build .pkg for Mac App Store
        env:
          CSC_LINK: /tmp/mas.p12
          CSC_KEY_PASSWORD: ${{ secrets.MAS_CERTS_PASSWORD }}
          CSC_INSTALLER_LINK: /tmp/mas-installer.p12
          CSC_INSTALLER_KEY_PASSWORD: ${{ secrets.MAS_INSTALLER_CERTS_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npx electron-builder --mac mas --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: claude-notifications-mas
          path: app/dist/mas/*.pkg
          if-no-files-found: warn

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifact tree
        run: |
          mkdir -p release-assets
          find artifacts -type f \( \
            -name '*.dmg' -o -name '*.zip' \
            -o -name '*.exe' -o -name '*.blockmap' \
            -o -name '*.AppImage' -o -name '*.deb' \
            -o -name 'latest-mac.yml' -o -name 'latest-mac.yaml' \
            -o -name 'latest.yml' -o -name 'latest-linux.yml' \
          \) -exec cp {} release-assets/ \;
          ls -la release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
