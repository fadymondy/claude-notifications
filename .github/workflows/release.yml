name: release

on:
  push:
    tags:
      - 'v*.*.*'
      - 'app-v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g. v0.2.0). Leave blank to use HEAD.'
        required: false

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: dist:mac
            artifacts: |
              app/dist/*.dmg
              app/dist/*.zip
          - os: windows-latest
            target: dist:win
            artifacts: |
              app/dist/*.exe
          - os: ubuntu-latest
            target: dist:linux
            artifacts: |
              app/dist/*.AppImage
              app/dist/*.deb
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install deps
        shell: bash
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi

      - name: Smoke tests
        run: npm test

      - name: Build distributables
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # electron-builder respects this for code signing skip on PRs / forks.
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npm run ${{ matrix.target }} -- --publish never

      - name: List build outputs
        shell: bash
        run: ls -la dist || true

      - name: Upload artifacts (workflow run)
        uses: actions/upload-artifact@v4
        with:
          name: claude-notifications-${{ matrix.os }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: warn
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifact tree
        run: |
          mkdir -p release-assets
          find artifacts -type f \( -name '*.dmg' -o -name '*.zip' -o -name '*.exe' -o -name '*.AppImage' -o -name '*.deb' \) -exec cp {} release-assets/ \;
          ls -la release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
